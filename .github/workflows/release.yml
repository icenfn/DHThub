name: Release

# 打 tag v*（如 v0.1.0）或手动触发时，自动构建并发布 Linux / Windows / Android 安装包
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 更新签名（可选）：首次运行 `npx tauri signer generate -w ~/.dhthub/tauri.key`
  # 后将私钥写入仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  release-linux:
    name: build linux (deb / appimage / rpm)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev build-essential curl wget file

      - name: 前端依赖
        run: npm install --no-audit --no-fund

      - name: 构建并发布（tauri-action 自动签名/生成 latest.json/上传 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DHThub ${{ github.ref_name }}'
          releaseBody: '请查看下方资产列表下载对应平台安装包。'
          releaseDraft: false
          force: true
          prerelease: false
          args: --bundles deb,appimage,rpm

  release-windows:
    name: build windows (nsis / msi)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 前端依赖
        run: npm install --no-audit --no-fund

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DHThub ${{ github.ref_name }}'
          releaseDraft: false
          force: true
          prerelease: false
          args: --bundles nsis,msi

  release-android:
    name: build android (apk, 4 abi)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # secrets 不允许在 if: 中使用，先注入 job 级 env 供 if 判断
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK（runner 已预装，仅补平台/工具并接受许可）
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" >/dev/null 2>&1 || true
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true

      - name: Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: 前端依赖
        run: npm install --no-audit --no-fund

      - name: 初始化 Android 工程
        run: npx tauri android init

      - name: 注入 APK 安装权限（更新检测自动安装用）
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - <<'EOF'
          import re
          p = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          with open(p, encoding='utf-8') as f:
              c = f.read()
          if 'REQUEST_INSTALL_PACKAGES' not in c:
              c = c.replace(
                  '<uses-permission android:name="android.permission.INTERNET"/>',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>',
              )
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          EOF

      - name: MainActivity 预留系统栏 inset（避免内容被状态栏/导航栏遮挡）
        run: |
          python3 - <<'PYEOF'
          import os
          p = 'src-tauri/gen/android/app/src/main/java/com/dhthub/app/MainActivity.kt'
          assert os.path.exists(p), 'MainActivity.kt not found'
          # TauriActivity 由 tauri android init 生成在应用同包（com.dhthub.app），无需 import
          code = '\n'.join([
              'package com.dhthub.app',
              '',
              'import android.os.Bundle',
              '',
              'class MainActivity : TauriActivity() {',
              '    override fun onCreate(savedInstanceState: Bundle?) {',
              '        super.onCreate(savedInstanceState)',
              '        // 预留顶部状态栏与底部导航栏，避免 WebView 内容被系统栏遮挡（edge-to-edge 适配）',
              '        window.decorView.setOnApplyWindowInsetsListener { v: android.view.View, insets: android.view.WindowInsets ->',
              '            if (android.os.Build.VERSION.SDK_INT >= 30) {',
              '                val bars = insets.getInsets(',
              '                    android.view.WindowInsets.Type.systemBars() or',
              '                        android.view.WindowInsets.Type.displayCutout()',
              '                )',
              '                v.setPadding(0, bars.top, 0, bars.bottom)',
              '            } else {',
              '                v.setPadding(0, insets.systemWindowInsetTop, 0, insets.systemWindowInsetBottom)',
              '            }',
              '            insets',
              '        }',
              '        window.decorView.requestApplyInsets()',
              '    }',
              '}',
          ])
          with open(p, 'w', encoding='utf-8') as f:
              f.write(code)
          print('MainActivity insets patch OK')
          PYEOF

      - name: 配置签名（有密钥用正式签名，否则生成 debug 签名保证 APK 可安装）
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > src-tauri/gen/android/keystore.properties
            echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> src-tauri/gen/android/keystore.properties
            echo "storeFile=$RUNNER_TEMP/release.keystore" >> src-tauri/gen/android/keystore.properties
            echo "storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> src-tauri/gen/android/keystore.properties
            base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/release.keystore
          else
            keytool -genkeypair -v -keystore $RUNNER_TEMP/debug.keystore \
              -alias debug -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android -dname "CN=Debug, OU=DHThub, O=DHThub, L=City, ST=State, C=CN" >/dev/null 2>&1
            echo "keyAlias=debug" > src-tauri/gen/android/keystore.properties
            echo "keyPassword=android" >> src-tauri/gen/android/keystore.properties
            echo "storeFile=$RUNNER_TEMP/debug.keystore" >> src-tauri/gen/android/keystore.properties
            echo "storePassword=android" >> src-tauri/gen/android/keystore.properties
          fi

      - name: Gradle 签名接线（tauri 2.12 模板不自动读 keystore.properties，按官方文档注入）
        run: |
          python3 - <<'PYEOF'
          p = 'src-tauri/gen/android/app/build.gradle.kts'
          s = open(p, encoding='utf-8').read()
          marker = '    buildTypes {'
          signing_block = '    signingConfigs {\n' \
              '        if (rootProject.file("keystore.properties").exists()) {\n' \
              '            val keystoreProperties = Properties().apply {\n' \
              '                load(rootProject.file("keystore.properties").inputStream())\n' \
              '            }\n' \
              '            create("release") {\n' \
              '                storeFile = file(keystoreProperties.getProperty("storeFile"))\n' \
              '                storePassword = keystoreProperties.getProperty("storePassword")\n' \
              '                keyAlias = keystoreProperties.getProperty("keyAlias")\n' \
              '                keyPassword = keystoreProperties.getProperty("keyPassword")\n' \
              '            }\n' \
              '        }\n' \
              '    }\n' \
              '    buildTypes {'
          assert marker in s, 'marker buildTypes not found'
          s = s.replace(marker, signing_block, 1)
          rel = '        getByName("release") {'
          assert rel in s, 'release buildType not found'
          s = s.replace(rel, rel + '\n            signingConfig = signingConfigs.findByName("release")', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('gradle signing wired OK')
          PYEOF

      - name: 构建 APK（split-per-abi，四架构）
        run: npx tauri android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  publish:
    name: 汇总发布 Android 资产到 GitHub Release
    needs: [release-linux, release-windows, release-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: android-apks

      - name: 发布/更新 Release（追加 Android APK）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android-apks/**/*.apk
          draft: false
