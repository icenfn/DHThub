name: Release

# 打 tag v*（如 v0.1.0）或手动触发时，自动构建并发布 Linux / Windows / Android 安装包
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  # 更新签名（可选）：首次运行 `npx tauri signer generate -w ~/.dhthub/tauri.key`
  # 后将私钥写入仓库 Secrets：TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  release-linux:
    name: build linux (deb / appimage / rpm)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libxdo-dev libssl-dev build-essential curl wget file

      - name: 前端依赖
        run: npm install --no-audit --no-fund

      - name: 构建并发布（tauri-action 自动签名/生成 latest.json/上传 Release）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DHThub ${{ github.ref_name }}'
          releaseBody: '请查看下方资产列表下载对应平台安装包。'
          releaseDraft: false
          force: true
          prerelease: false
          args: --bundles deb,appimage,rpm

  release-windows:
    name: build windows (nsis / msi)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: 前端依赖
        run: npm install --no-audit --no-fund

      - name: 构建并发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DHThub ${{ github.ref_name }}'
          releaseDraft: false
          force: true
          prerelease: false
          args: --bundles nsis,msi

  release-android:
    name: build android (apk, 4 abi)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # secrets 不允许在 if: 中使用，先注入 job 级 env 供 if 判断
      ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain + Android 交叉编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK（runner 已预装，仅补平台/工具并接受许可）
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          export PATH="${ANDROID_HOME}/cmdline-tools/latest/bin:${ANDROID_HOME}/cmdline-tools/16.0/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;34.0.0" "build-tools;35.0.0" >/dev/null 2>&1 || true
          ls "${ANDROID_HOME}/platforms" 2>/dev/null || true

      - name: Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: 前端依赖
        run: npm install --no-audit --no-fund

      - name: 初始化 Android 工程
        run: npx tauri android init

      - name: 注入 APK 安装权限（更新检测自动安装用）
        run: |
          MANIFEST=src-tauri/gen/android/app/src/main/AndroidManifest.xml
          python3 - <<'EOF'
          import re
          p = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          with open(p, encoding='utf-8') as f:
              c = f.read()
          if 'REQUEST_INSTALL_PACKAGES' not in c:
              c = c.replace(
                  '<uses-permission android:name="android.permission.INTERNET"/>',
                  '<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>',
              )
          with open(p, 'w', encoding='utf-8') as f:
              f.write(c)
          EOF

      - name: 配置签名（未配置密钥时使用 debug 签名）
        if: env.ANDROID_KEY_BASE64 != ''
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > src-tauri/gen/android/keystore.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> src-tauri/gen/android/keystore.properties
          echo "storeFile=$RUNNER_TEMP/release.keystore" >> src-tauri/gen/android/keystore.properties
          echo "storePassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> src-tauri/gen/android/keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/release.keystore

      - name: 构建 APK（split-per-abi，四架构）
        run: cargo tauri android build --apk --split-per-abi
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error

  publish:
    name: 汇总发布 Android 资产到 GitHub Release
    needs: [release-linux, release-windows, release-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: android-apks

      - name: 发布/更新 Release（追加 Android APK）
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: android-apks/**/*.apk
          draft: false
