[package]
name = "dhthub"
version = "0.2.7"
description = "DHThub - 多源磁力链接聚合搜索"
authors = ["DHThub"]
edition = "2021"

[lib]
name = "dhthub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
tauri-plugin-updater = "2.13.1"
tauri-plugin-store = "2.5.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-clipboard-manager = "2.4.1"
tauri-plugin-opener = "2.7.0"
tauri-plugin-http = "2.8.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-shell = "2.4.0"
tauri-plugin-log = "2.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls", "webpki-roots", "gzip", "brotli", "deflate", "stream"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "fs"] }
scraper = "0.27"
futures = "0.3"
urlencoding = "2"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
